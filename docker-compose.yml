services:
  gateway-service:
    environment:
      eureka.client.serviceUrl.defaultZone: http://eureka-service:9283/eureka/
    build:
      context: ./GatewayGitService
      dockerfile: Dockerfile
    ports:
      - "5743:8085"
    depends_on:
      - eureka-service

  mongo-db:
    image: 'mongo:latest'
    environment:
      - MONGO_INITDB_ROOT_USERNAME=postgres
      - MONGO_INITDB_ROOT_PASSWORD=postgres
      - MONGO_INITDB_DATABASE=releases
    ports:
      - '27017:27017'
    depends_on:
      - eureka-service


  release-service:
    build:
      context: ./ReleaseGitService
      dockerfile: Dockerfile
    ports:
      - "8432:8080"
    environment:
      eureka.client.serviceUrl.defaultZone: http://eureka-service:9283/eureka/
      SPRING_DATASOURCE_URL: mongodb://mongo-db:27017/releases
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      - mongo-db
      - eureka-service



  postgres-user:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=users'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5433:5433'
    depends_on:
      - eureka-service

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper


  user-service:
    build:
      context: ./UserGitService
      dockerfile: Dockerfile
    ports:
      - "9235:8081"
    environment:
      eureka.client.serviceUrl.defaultZone: http://eureka-service:9283/eureka/
      SPRING_DATASOURCE_URL1: jdbc:postgresql://postgres-user:5432/users
      SPRING_DATASOURCE_USERNAME1: postgres
      SPRING_DATASOURCE_PASSWORD1: postgres
    depends_on:
      - postgres-user
      - eureka-service


  notification-service:
    environment:
      eureka.client.serviceUrl.defaultZone: http://eureka-service:9283/eureka/
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_GROUP_ID: notification-service-group
    build:
      context: ./NotificationSenderGitService
      dockerfile: Dockerfile
    ports:
      - "9834:8082"
    depends_on:
      - eureka-service
      - kafka


  application-service:
    environment:
      eureka.client.serviceUrl.defaultZone: http://eureka-service:9283/eureka/
    build:
      context: ./ApplicationGitService
      dockerfile: Dockerfile
    ports:
      - "2452:8084"
    depends_on:
      - eureka-service

  eureka-service:
    build:
      context: ./EurekaGitService
      dockerfile: Dockerfile
    ports:
      - "9283:9283"
    environment:
      eureka.client.register-with-eureka: false
      eureka.client.fetch-registry: false
      # Optional but recommended for single-node dev:
      eureka.server.enable-self-preservation: false
      eureka.instance.hostname: eureka-service
      eureka.client.serviceUrl.defaultZone: http://eureka-service:9283/eureka/  # even though it's ignored

networks:
  crud-network:
    driver: bridge



