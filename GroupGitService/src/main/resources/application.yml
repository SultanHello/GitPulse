spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect:  org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: ${SPRING_DATASOURCE_URL1}
    username: ${SPRING_DATASOURCE_USERNAME1}
    password: ${SPRING_DATASOURCE_PASSWORD1}
    driver-class-name: org.postgresql.Driver
  application:
    name: GroupGitService

eureka:
  client:
    service-url:
      defaultZone : http://localhost:9283/eureka/

server:
  port: 8079